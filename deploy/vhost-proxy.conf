# ADD these blocks to the EXISTING CyberPanel vhost config for your domain.
# Do not replace the entire vhost file; keep existing SSL/PHP/log/listener config.
# If the site already has a context / block, replace/resolve that context instead of duplicating it.

extprocessor flowboard_proxy {
  type                    proxy
  address                 127.0.0.1:3000
  maxConns                100
  initTimeout             60
  retryTimeout            0
  respBuffer              0
}

context / {
  type                    proxy
  handler                 flowboard_proxy
  addDefaultCharset       off
}
